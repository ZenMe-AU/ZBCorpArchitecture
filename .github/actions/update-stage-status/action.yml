name: Update Stage Status
description: Update the status of a stage based on Terraform plan results

inputs:
  stage:
    description: "Stage code"
    required: true
  dir:
    description: "Directory name"
    required: true
  needs_azure:
    description: "Whether Azure login is needed"
    required: false
    default: "false"
  needs_aws:
    description: "Whether AWS login is needed"
    required: false
    default: "false"
  azure_ok:
    description: "Whether Azure login is expected to succeed"
    required: false
    default: "true"
  aws_ok:
    description: "Whether AWS login is expected to succeed"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Run via Node
      id: run
      continue-on-error: true
      if: |
        (inputs.needs_azure != 'true' || inputs.azure_ok == 'true') &&
        (inputs.needs_aws != 'true' || inputs.aws_ok == 'true')
      shell: bash
      working-directory: corpSetup
      run: |
        node initCorpEnvDeploy.js --stage=${{ inputs.stage }} --planOnly

    - name: Convert to JSON
      if: steps.run.outcome == 'success'
      shell: bash
      working-directory: corpSetup/${{ inputs.dir }}
      run: |
        if [ -f tfplan ]; then
          terraform show -json tfplan > plan.json
        fi

    - name: Write status
      if: always()
      shell: bash
      working-directory: corpSetup/${{ inputs.dir }}
      run: |
        TS=$(date +%s)
        STATUS="failed"
        PLAN_PATH=""

        if [ "${{ steps.run.outcome }}" = "success" ]; then
          STATUS="success"
          PLAN_PATH="corpSetup/${{ inputs.dir }}/plan.json"
        fi

        cat <<EOF > status.json
        {
          "runId": "${{ github.run_id }}",
          "stage": "${{ inputs.stage }}",
          "name": "${{ inputs.dir }}",
          "planPath": "$PLAN_PATH",
          "status": "$STATUS",
          "timestamp": $TS
        }
        EOF

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: ignore
        name: ${{ inputs.dir }}
        path: corpSetup/${{ inputs.dir }}
