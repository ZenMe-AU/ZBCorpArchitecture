name: update status

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name"
        required: false
        default: "dev"

permissions:
  contents: read
  id-token: write

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        shell: bash
        run: |
          missing=0
          [ -z "${{ secrets.AZURE_CLIENT_ID }}" ] && echo "Missing AZURE_CLIENT_ID" && missing=1
          [ -z "${{ secrets.AZURE_TENANT_ID }}" ] && echo "Missing AZURE_TENANT_ID" && missing=1
          [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ] && echo "Missing AZURE_SUBSCRIPTION_ID" && missing=1
          if [ $missing -eq 1 ]; then
            echo "Some required secrets are missing. Exiting."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        shell: bash
        run: az account show

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: us-east-1

      - name: verify AWS credentials
        shell: bash
        run: aws sts get-caller-identity

      - name: Set Terraform environment variables
        shell: bash
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> $GITHUB_ENV
          echo "ARM_USE_OIDC=true" >> $GITHUB_ENV

      - name: Run via Node
        id: run_c01
        working-directory: corpSetup
        run: node initCorpEnvDeploy.js --stage=c01 --planOnly
        continue-on-error: true

      - name: Write status
        if: always()
        working-directory: corpSetup/c01subscription
        run: |
          TS=$(date +%s)
          STATUS="failed"
          PLAN_PATH=""
          if [ "${{ steps.run_c01.outcome }}" = "success" ]; then
            STATUS="success"
            PLAN_PATH="corpSetup/c01subscription/plan.json"
          fi

          cat <<EOF > status.json
          {
            "stage": "c01",
            "planPath": "$PLAN_PATH",
            "status": "$STATUS",
            "timestamp": $TS
          }
          EOF

      - name: Convert to JSON
        if: steps.run_c01.outcome == 'success'
        working-directory: corpSetup/c01subscription
        run: terraform show -json tfplan > plan.json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: c01subscription
          path: |
            corpSetup/c01subscription

      - name: Run via Node
        id: run_c02
        working-directory: corpSetup
        run: node initCorpEnvDeploy.js --stage=c02 --planOnly
        continue-on-error: true

      - name: Write status
        if: always()
        working-directory: corpSetup/c02globalGroups
        run: |
          TS=$(date +%s)
          STATUS="failed"
          PLAN_PATH=""
          if [ "${{ steps.run_c02.outcome }}" = "success" ]; then
            STATUS="success"
            PLAN_PATH="corpSetup/c02globalGroups/plan.json"
          fi

          cat <<EOF > status.json
          {
            "stage": "c02",
            "planPath": "$PLAN_PATH",
            "status": "$STATUS",
            "timestamp": $TS
          }
          EOF

      - name: Convert to JSON
        if: steps.run_c02.outcome == 'success'
        working-directory: corpSetup/c02globalGroups
        run: terraform show -json tfplan > plan.json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: c02globalGroups
          path: |
            corpSetup/c02globalGroups

      - name: Run via Node
        id: run_c05
        working-directory: corpSetup
        run: node initCorpEnvDeploy.js --stage=c05 --planOnly
        continue-on-error: true

      - name: Write status
        if: always()
        working-directory: corpSetup/c05rootrg
        run: |
          TS=$(date +%s)
          STATUS="failed"
          PLAN_PATH=""
          if [ "${{ steps.run_c05.outcome }}" = "success" ]; then
            STATUS="success"
            PLAN_PATH="corpSetup/c05rootrg/plan.json"
          fi

          cat <<EOF > status.json
          {
            "stage": "c05",
            "planPath": "$PLAN_PATH",
            "status": "$STATUS",
            "timestamp": $TS
          }
          EOF

      - name: Convert to JSON
        if: steps.run_c05.outcome == 'success'
        working-directory: corpSetup/c05rootrg
        run: terraform show -json tfplan > plan.json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: c05rootrg
          path: |
            corpSetup/c05rootrg

      - name: Run via Node
        id: run_c20
        working-directory: corpSetup
        run: node initCorpEnvDeploy.js --stage=c20 --planOnly
        continue-on-error: true

      - name: Write status
        if: always()
        working-directory: corpSetup/c20awsentrasso
        run: |
          TS=$(date +%s)
          STATUS="failed"
          PLAN_PATH=""
          if [ "${{ steps.run_c20.outcome }}" = "success" ]; then
            STATUS="success"
            PLAN_PATH="corpSetup/c20awsentrasso/plan.json"
          fi

          cat <<EOF > status.json
          {
            "stage": "c20",
            "planPath": "$PLAN_PATH",
            "status": "$STATUS",
            "timestamp": $TS
          }
          EOF

      - name: Convert to JSON
        if: steps.run_c20.outcome == 'success'
        working-directory: corpSetup/c20awsentrasso
        run: terraform show -json tfplan > plan.json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: c20awsentrasso
          path: |
            corpSetup/c20awsentrasso

      - name: Run via Node
        id: run_c21
        working-directory: corpSetup
        run: node initCorpEnvDeploy.js --stage=c21 --planOnly
        continue-on-error: true

      - name: Write status
        if: always()
        working-directory: corpSetup/c21awsentrassoP2
        run: |
          TS=$(date +%s)
          STATUS="failed"
          PLAN_PATH=""
          if [ "${{ steps.run_c21.outcome }}" = "success" ]; then
            STATUS="success"
            PLAN_PATH="corpSetup/c21awsentrassoP2/plan.json"
          fi

          cat <<EOF > status.json
          {
            "stage": "c21",
            "planPath": "$PLAN_PATH",
            "status": "$STATUS",
            "timestamp": $TS
          }
          EOF

      - name: Convert to JSON
        if: steps.run_c21.outcome == 'success'
        working-directory: corpSetup/c21awsentrassoP2
        run: terraform show -json tfplan > plan.json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: c21awsentrassoP2
          path: |
            corpSetup/c21awsentrassoP2

      - name: Run via Node
        id: run_c25
        working-directory: corpSetup
        run: node initCorpEnvDeploy.js --stage=c25 --planOnly
        continue-on-error: true

      - name: Write status
        if: always()
        working-directory: corpSetup/c25cloudfront
        run: |
          TS=$(date +%s)
          STATUS="failed"
          PLAN_PATH=""
          if [ "${{ steps.run_c25.outcome }}" = "success" ]; then
            STATUS="success"
            PLAN_PATH="corpSetup/c25cloudfront/plan.json"
          fi

          cat <<EOF > status.json
          {
            "stage": "c25",
            "planPath": "$PLAN_PATH",
            "status": "$STATUS",
            "timestamp": $TS
          }
          EOF

      - name: Convert to JSON
        if: steps.run_c25.outcome == 'success'
        working-directory: corpSetup/c25cloudfront
        run: terraform show -json tfplan > plan.json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: c25cloudfront
          path: |
            corpSetup/c25cloudfront

  commit:
    permissions:
      contents: write
    needs: update-status
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize files
        run: |
          mkdir -p corpSetup

          if [ -d artifacts ]; then
            for dir in artifacts/*; do
              [ -d "$dir" ] || continue

              name=$(basename "$dir")
              mkdir -p corpSetup/$name
              cp -r "$dir"/* corpSetup/$name/ || true
            done
          fi

      - name: Merge status
        run: |
          FILES=$(find corpSetup -name status.json 2>/dev/null)

          if [ -z "$FILES" ]; then
            echo "[]" > /tmp/stages.json
          else
            jq -s '.' $FILES > /tmp/stages.json
          fi

          # generate cloud status
          AZURE_OK=true
          AWS_OK=true

          [ -z "${{ secrets.AZURE_CLIENT_ID }}" ] && AZURE_OK=false
          [ -z "${{ secrets.AZURE_TENANT_ID }}" ] && AZURE_OK=false
          [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ] && AZURE_OK=false

          [ -z "${{ secrets.AWS_ACCOUNT_ID }}" ] && AWS_OK=false
          [ -z "${{ secrets.AWS_ROLE_NAME }}" ] && AWS_OK=false

          cat <<EOF > /tmp/cloud.json
          {
            "azure": { "configured": $AZURE_OK },
            "aws": { "configured": $AWS_OK }
          }
          EOF

          # final output
          jq -n \
            --slurpfile stages /tmp/stages.json \
            --slurpfile cloud /tmp/cloud.json \
            '{
              azure: $cloud[0].azure,
              aws: $cloud[0].aws,
              stages: $stages[0]
            }' > corpSetup/status.json

      - name: Commit results
        run: |
          BRANCH=${{ github.event.inputs.branch }}
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git fetch origin || true
          git checkout -B $BRANCH origin/$BRANCH || git checkout -b $BRANCH

          git add corpSetup
          git commit -m "Update status" || echo "no changes"
          git push origin $BRANCH
